<body>

    <header>
        <h1>적악마 지역</h1>
        <p>적악마가 생활하는 지역의 기록</p>

    <main>

        <section class="century-selector">

            </p>

            <div class="century-slider-area">

                <div class="century-labels">
                    <span>&lt;추후 공지&gt;</span>
                    <span>20세기</span>
                </div>

                <input
                    type="range"
                    id="centurySlider"
                    min="0"
                    max="1"
                    step="1"
                    value="1"
                >

                <p id="selectedCentury">20세기 기록</p>

            </div>

        </section>


        <section id="futureRecords" class="century-content hidden">

            <h2>&lt;추후 공지&gt;</h2>

            <p>

            </p>

        </section>


        <section id="twentiethCenturyRecords" class="century-content">

            <h2>20세기 기록</h2>

            <section class="record-card">

                <h3>
                    <a href="The_Hellspital.html">The Hellspital</a>
                </h3>

                <p>
                    적악마 지역에 위치한 병원의 기록입니다.
                </p>
